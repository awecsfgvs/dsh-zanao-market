name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法检查
        run: |
          node --check index.js
          for f in lib/*.mjs; do node --check "$f"; done
      - name: 离线闸门（不连网、不需要 token）
        run: node test/gates.mjs